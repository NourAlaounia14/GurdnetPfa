<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <span class="shield-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M12 2 20 5.5v6.2c0 5-3.3 8.8-8 10.3-4.7-1.5-8-5.3-8-10.3V5.5L12 2Z"></path>
          <path d="M8.9 12.1 10.9 14l4.4-4.6"></path>
        </svg>
      </span>
      <h1>GuardNet</h1>
      <p>Plateforme intelligente de supervision et détection d’anomalies réseau</p>
    </div>

    <div class="mode-switch">
      <button type="button" [class.active]="mode === 'login'" (click)="mode = 'login'">Connexion</button>
      <button type="button" [class.active]="mode === 'register'" (click)="mode = 'register'">Inscription admin</button>
    </div>

    <div class="login-form">
      <div class="form-group" *ngIf="mode === 'register'">
        <label>Nom administrateur</label>
        <input type="text" [(ngModel)]="nom" placeholder="Admin GuardNet" class="form-input" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="admin@guardnet.com" class="form-input" />
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="password" placeholder="********" class="form-input" />
      </div>

      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>

      <button class="login-btn" (click)="mode === 'login' ? onLogin() : onRegister()" [disabled]="isLoading">
        {{ isLoading ? 'Traitement...' : (mode === 'login' ? 'Se connecter' : 'Creer le compte') }}
      </button>
    </div>
  </div>
</div>
